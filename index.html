<style>
body{margin:0}
.serif{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-style:normal;font-weight:600;letter-spacing:-0.01em}
.press{transition:transform .12s ease}
.press:active{transform:scale(.94)}
.anim-bob{animation:pdBob 2.6s ease-in-out infinite}
.anim-dance{animation:pdDance .9s ease-in-out infinite}
.anim-shake{animation:pdShake .45s ease-in-out infinite}
.anim-droop{animation:pdDroop 3.4s ease-in-out infinite}
.jumpA{animation:pdJumpA .6s cubic-bezier(.3,.7,.4,1)}
.jumpB{animation:pdJumpB .6s cubic-bezier(.3,.7,.4,1)}
.popA{animation:pdPopA .35s ease-out both}
.popB{animation:pdPopB .35s ease-out both}
.blink{transform-box:fill-box;transform-origin:center;animation:pdBlink 4.2s infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:pdSpin 14s linear infinite}
.float1{animation:pdFloat 4s ease-in-out infinite}
.float2{animation:pdFloat 5.2s ease-in-out infinite reverse}
.sheet{animation:pdSheet .34s cubic-bezier(.2,.9,.3,1.08)}
.fade{animation:pdFade .25s ease}
@keyframes pdBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-8px) scale(1.03,.97)}}
@keyframes pdDance{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-12px)}}
@keyframes pdShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
@keyframes pdDroop{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(5px) scale(1.05,.95)}}
@keyframes pdJumpA{0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(0) scale(1.18,.82)}50%{transform:translateY(-46px) scale(.9,1.12) rotate(-6deg)}78%{transform:translateY(0) scale(1.12,.88)}100%{transform:translateY(0) scale(1,1)}}
@keyframes pdJumpB{0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(0) scale(1.18,.82)}50%{transform:translateY(-46px) scale(.9,1.12) rotate(6deg)}78%{transform:translateY(0) scale(1.12,.88)}100%{transform:translateY(0) scale(1,1)}}
@keyframes pdPopA{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pdPopB{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pdBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes pdSpin{to{transform:rotate(360deg)}}
@keyframes pdFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(8deg)}}
@keyframes pdSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pdFade{from{opacity:0}to{opacity:1}}
</style>
<style>
html,body{margin:0;background:#F5F5F3}
button:focus-visible,input:focus-visible{outline:3px solid #2F6BFF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

    this._curMood = m;
    let moodLine = m.line;
    if (moodKey === 'broke') moodLine = 'งบรอบนี้หมดแล้ว ยังต้องรอดอีก ' + daysLeft + ' วัน';
    if (moodKey === 'sweating') moodLine = 'งบต่อวันเหลือแค่ ' + Math.round(ratio * 100) + '% ของปกติ';

    let rem = startAmt, okCount = 0, maxA = 0, maxIso = null;
    for (let i = 0; i <= elapsedDays; i++) {
      const d = new Date(c.start.getFullYear(), c.start.getMonth(), c.start.getDate() + i);
      const sp = sumOn(this.iso(d));
      if (i < elapsedDays) { if (sp <= Math.max(0, rem) / (cycleLen - i)) okCount++; }
      if (sp > maxA) { maxA = sp; maxIso = d; }
      rem -= sp;
    }
    const avg = spentCycle / (elapsedDays + 1);
    const projected = startAmt - avg * cycleLen;

    const amtNum = this.num(s.amtStr) || 0;
    const afterLeft = leftToday - amtNum;
    const jumpTo = (days) => on('whoosh', () => set({ offset: s.offset + days, simOpen: false, bubbleN: 0 }));
    const jumps = [{ label: 'พรุ่งนี้', bg: '#DDF8B0', go: jumpTo(1) }, { label: 'อีก 1 สัปดาห์', bg: '#C9BCF7', go: jumpTo(7) }];
    if (daysLeft > 1) jumps.push({ label: 'วันก่อนเงินออก', bg: '#FFB5E8', go: jumpTo(daysLeft - 1) });
    jumps.push({ label: 'วันเงินออก!', bg: '#FFE45C', go: jumpTo(daysLeft) });
    const shortDate = (d) => d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
    const lastDay = new Date(c.end.getFullYear(), c.end.getMonth(), c.end.getDate() - 1);
    const press = (k) => {
      if (k === 'del') return on('del', () => set({ amtStr: s.amtStr.slice(0, -1) }));
      return on('tick', () => { const nx = (s.amtStr + k).replace(/^0+/, ''); if (nx.length <= 7) set({ amtStr: nx }); });
    };
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', 'del'].map((k) => ({
      label: k === 'del' ? '⌫' : k, aria: k === 'del' ? 'ลบตัวเลข' : k, press: press(k)
    }));

    return Object.assign(v, {
      todayLabel: t.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'short' }),
      todayShort: t.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' }),
      texOpts: v.texOpts.map((o, i) => Object.assign({}, o, { cv: this.charVals(m, this.texList()[i][0], 'tx' + i) })),
      ch: this.charVals(m, s.texture, 'ch'), recapOpen: false, moodBg: this.tint(m, s.texture), moodTag: m.tag, moodTitle: m.title, moodLine: moodLine,
      bigLabel: leftToday >= 0 ? 'วันนี้ใช้ได้อีก' : 'วันนี้ใช้เกินไปแล้ว',
      bigValue: this.fmt(Math.abs(leftToday)),
      bigColor: leftToday >= 0 ? '#161616' : '#C4136B',
      allowance: this.fmt(allowance), perMeal: this.fmt(allowance / 3),
      daysLeft: String(daysLeft),
      startAmt: this.fmt(startAmt),
      paydayShort: c.end.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' }) + (c.shifted ? ' · เลื่อนจากวันหยุด' : ''),
      progressPct: Math.max(4, Math.min(100, Math.round(elapsedFrac * 100))),
      hasToday: todays.length > 0,
      todayItems: todays.map((x) => ({ label: '฿' + this.fmt(x.amt), remove: on('del', () => set({ log: s.log.filter((y) => y.id !== x.id) })) })),
      cycleRange: shortDate(c.start) + ' – ' + shortDate(lastDay),
      spentCycle: this.fmt(spentCycle),
      spentPct: startAmt > 0 ? String(Math.round(spentCycle / startAmt * 100)) : '0',
      avgDay: this.fmt(avg), baseDay: this.fmt(baseline),
      okDays: elapsedDays > 0 ? okCount + '/' + elapsedDays + ' วัน' : 'วันแรก',
      maxAmt: maxIso ? '฿' + this.fmt(maxA) : '—',
      maxDay: maxIso ? shortDate(maxIso) : 'ยังไม่มีรายการ',
      projection: spentCycle === 0 ? 'ยังไม่มีข้อมูล ลองบันทึกสักรายการ' : (projected >= 0 ? 'น่าจะเหลือประมาณ ฿' + this.fmt(projected) : 'น่าจะขาดไปประมาณ ฿' + this.fmt(-projected)),
      jumps: jumps,
      amtDisplay: amtNum ? this.fmt(amtNum) : '0',
      chips: [['50', '#DDF8B0'], ['100', '#C9BCF7'], ['200', '#FFB5E8'], ['500', '#FFE45C']].map((p) => ({
        label: p[0], bg: p[1], pick: on('tick', () => set({ amtStr: String(amtNum + parseInt(p[0], 10)) }))
      })),
      keys: keys,
      previewLine: amtNum ? (afterLeft >= 0 ? 'บันทึกแล้ววันนี้จะเหลือ ฿' + this.fmt(afterLeft) : 'จะเกินงบวันนี้ ฿' + this.fmt(-afterLeft) + ' · วันที่เหลือจะเกลี่ยงบใหม่') : 'วันนี้ใช้ได้อีก ฿' + this.fmt(Math.max(0, leftToday)),
      previewColor: amtNum && afterLeft < 0 ? '#C4136B' : '#444444',
      save: () => {
        if (!amtNum) { this.sfx('nope', s.muted); return; }
        this.sfx('coin', s.muted);
        const entry = { id: Date.now() + '-' + Math.random(), amt: amtNum, date: tIso };
        set({ log: s.log.concat([entry]), sheetOpen: false, amtStr: '', jumpN: s.jumpN + 1, bubbleN: s.bubbleN + 1, bubbleText: afterLeft >= 0 ? 'จดแล้ว ฿' + this.fmt(amtNum) + '!' : 'อุ๊ย เกินงบแล้ว' });
      },
      ...this.extras(s, t, c, startIso, sumOn, on, set),
      scrollRef: (el) => {
        if (el && s.scrollTo && !this._scrolled) {
          this._scrolled = true;
          setTimeout(() => { el.scrollTop = el.scrollHeight; }, 120);
        }
      }
    });
  }
}
window.__mount(Component);
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
